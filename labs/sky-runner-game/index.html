<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sky Runner — Godot Arena</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #070b18; overflow: hidden; }
      body {
        display: grid; place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #e6ecff;
      }
      #app { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
      #game { line-height: 0; border-radius: 14px; overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,.6); }
      #game canvas { display: block; }
      #hud-status {
        position: fixed; left: 12px; bottom: 10px; font-size: 12px; letter-spacing: .04em;
        color: #7f8cb5; pointer-events: none; user-select: none;
      }
      #hud-status.ok { color: #46d98a; }
      #hud-status.off { color: #ff7a7a; }
    </style>
  </head>
  <body>
    <div id="app"><div id="game"></div></div>
    <div id="hud-status">menghubungkan server…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
