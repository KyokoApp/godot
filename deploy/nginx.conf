# /etc/nginx/sites-available/sky-legion-live
# ganti live.contoh.com dengan domain kamu, lalu:
#   sudo ln -s /etc/nginx/sites-available/sky-legion-live /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d live.contoh.com

upstream sky_legion {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name live.contoh.com;

    # biarkan certbot handle redirect ke HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name live.contoh.com;

    ssl_certificate     /etc/letsencrypt/live/live.contoh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.contoh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;
    # HTML/CSS/JS boleh gzip.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # WebSocket arena: wajib Upgrade + timeout panjang supaya tidak ke-drop
    # saat siaran berjalan berjam-jam.
    location /ws {
        proxy_pass http://sky_legion;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://sky_legion;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~* \.(css|png|jpg|jpeg|svg|ttf|woff2)$ {
        proxy_pass http://sky_legion;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://sky_legion;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
