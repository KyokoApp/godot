# /etc/nginx/sites-available/little-legions
# ganti littlelegions.contoh.com dengan domain kamu, lalu:
#   sudo ln -s /etc/nginx/sites-available/little-legions /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d littlelegions.contoh.com

upstream little_legions {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name littlelegions.contoh.com;

    # biarkan certbot handle redirect ke HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name littlelegions.contoh.com;

    ssl_certificate     /etc/letsencrypt/live/littlelegions.contoh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/littlelegions.contoh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;
    # HTML/CSS/JS kecil boleh gzip. JANGAN gzip /Build/*.unityweb — sudah terkompresi.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Build Unity WebGL: sudah gzip di dalam, cache 1 tahun, tidak di-gzip ulang.
    location /Build/ {
        proxy_pass http://little_legions;
        proxy_set_header Host $host;
        gzip off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://little_legions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~* \.(css|png|jpg|jpeg|svg|ttf|woff2)$ {
        proxy_pass http://little_legions;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://little_legions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
