services:
  little-legions:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: little-legions:latest
    container_name: little-legions
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TZ=Asia/Jakarta
      - CORS_ORIGIN=*
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
