services:
  skyrunner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: skyrunner:latest
    container_name: skyrunner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - skyrunner-data:/data
    environment:
      - TZ=Asia/Jakarta
      - CORS_ORIGIN=*
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  skyrunner-data:
